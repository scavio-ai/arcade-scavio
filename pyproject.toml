[project]
name = "arcade-scavio"
version = "0.4.0"
description = "Scavio real-time search and URL extraction tools (Google, Google News, Reddit, YouTube, Amazon, HEB, Kroger, extract, website map, crawl and batch) for Arcade.dev / MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Scavio", email = "support@scavio.dev" }]
keywords = ["arcade", "arcade-ai", "mcp", "scavio", "search", "serp", "tools", "extract", "web-crawler", "sitemap", "web-scraping", "tavily-alternative"]
dependencies = [
    "arcade-mcp-server>=1.17.4,<2.0.0",
    "scavio>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "arcade-mcp[all]>=1.11.2,<2.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://scavio.dev"
Repository = "https://github.com/scavio-ai/arcade-scavio"
Documentation = "https://scavio.dev/docs/arcade"

# Tell Arcade.dev that this package ships Arcade tools
[project.entry-points.arcade_toolkits]
scavio = "arcade_scavio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcade_scavio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
